<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Orang Tua | HSIN</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <!-- Google Fonts: Plus Jakarta Sans -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Supabase JS Client CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Awesomplete CSS (Untuk Auto-suggest) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/awesomplete/1.1.5/awesomplete.min.css" />
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Plus Jakarta Sans', 'sans-serif'] },
                    colors: {
                        brand: {
                            dark: '#1e293b',
                            darker: '#0f172a',
                            putri: '#00bb96', // Emerald
                            putra: '#ffca41'  // Amber/Gold
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8fafc; }
        .fade-in { animation: fadeIn 0.3s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        .toast-enter { transform: translateY(0); opacity: 1; pointer-events: auto; }
        .toast-exit { transform: translateY(150%); opacity: 0; pointer-events: none; }
        
        /* Custom Styling for Awesomplete */
        .awesomplete { width: 100%; display: block; }
        .awesomplete > ul { border-radius: 0.75rem; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1); border: 1px solid #e2e8f0; margin-top: 0.25rem; font-size: 0.875rem; font-weight: 500; z-index: 50; }
        .awesomplete > ul > li { padding: 0.75rem 1rem; color: #475569; transition: background-color 0.2s; }
        .awesomplete > ul > li:hover, .awesomplete > ul > li[aria-selected="true"] { background-color: #f1f5f9; color: #1e293b; }
        .awesomplete mark { background: transparent; font-weight: 800; color: #0f172a; }
    </style>
</head>
<body class="text-slate-800 antialiased overflow-x-hidden">

    <!-- HALAMAN LOGIN (Kini Bersih dan Netral/Abu-abu) -->
    <div id="login-view" class="flex flex-col lg:flex-row min-h-screen w-full bg-slate-50 relative z-10">

    <!-- MAIN APP CONTAINER (Dasbor Utama) -->

        <!-- Main Content Area -->

                <div class="flex items-center gap-4 pl-3">

            <!-- TAB 1: JADWAL & MAPEL -->

                    </div>

            <!-- TAB 2: PRESENSI -->
            <div id="tab-presensi" class="tab-content hidden space-y-6 fade-in">

                    <div class="p-6">

                        </div>
                    </div>

            </div>

            <!-- TAB 3: PENGATURAN -->
            <div id="tab-pengaturan" class="tab-content hidden fade-in">

                    <div class="px-6 py-5 border-b border-slate-100 bg-slate-50/50">
                        <h2 class="font-bold text-lg text-slate-800"><i class="fas fa-lock mr-2 text-slate-400"></i> Ubah Password Akun</h2>
                    </div>
                    <div class="p-6">
                        <form onsubmit="handleUbahPassword(event)" class="space-y-4">
                            <div>
                                <label class="block text-xs font-bold text-slate-500 mb-1.5 uppercase tracking-wider">Password Baru</label>
                                <input type="password" id="pwd-baru" required placeholder="Masukkan password baru..." class="w-full border border-slate-200 bg-slate-50 p-3.5 rounded-xl text-sm font-medium focus:bg-white focus:ring-2 focus:border-slate-300 outline-none shadow-sm transition-all mb-4">
                                
                                <label class="block text-xs font-bold text-slate-500 mb-1.5 uppercase tracking-wider">Konfirmasi Password</label>
                                <input type="password" id="pwd-konfirmasi" required placeholder="Ulangi password baru..." class="w-full border border-slate-200 bg-slate-50 p-3.5 rounded-xl text-sm font-medium focus:bg-white focus:ring-2 focus:border-slate-300 outline-none shadow-sm transition-all">
                            </div>
                            <button type="submit" id="btn-save-pwd" class="w-full text-white font-bold py-3.5 rounded-xl shadow-md mt-4 transition-colors duration-500 flex justify-center items-center gap-2">

            </div>

        </main>

    <!-- Notifikasi Toast -->
    <div id="toast-error" class="fixed bottom-6 right-6 bg-slate-900 text-white px-6 py-4 rounded-xl shadow-2xl transition-all duration-300 toast-exit flex items-center gap-4 z-50 text-sm font-medium border border-slate-700">
        <i class="fas fa-info-circle text-lg"></i>
        <span id="toast-msg"></span>
    </div>

    <!-- Script Awesomplete -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/awesomplete/1.1.5/awesomplete.min.js"></script>

    <script>
        // Konfigurasi Supabase Anda (Gunakan Anon Key)
        const SUPABASE_URL = 'https://nqexcwcissrnxtxalkxn.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5xZXhjd2Npc3Nybnh0eGFsa3huIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY1Mjc3NDYsImV4cCI6MjEwMjEwMzc0Nn0.kYan3Wj3Ll8S6jFQoXbBJMEZn9cSTKNMYM1EuIly3NI';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let currentSession = null;
        let themeColor = "#1e293b"; // Default Netral
        let allStudentsList = []; // Array untuk menyimpan semua nama siswa
        let awesompleteInstance; // Instance library auto-suggest

        // Inisialisasi awal saat halaman dimuat
        document.addEventListener("DOMContentLoaded", async () => {
            await fetchAllStudentNames();
            initAutoSuggest();
        });

        // Menarik semua nama siswa (hanya kolom nama) dari Supabase untuk keperluan auto-suggest
        async function fetchAllStudentNames() {
            try {
                const { data, error } = await supabaseClient
                    .from('master_data_siswa')
                    .select('nama_lengkap');
                
                if (error) throw error;
                
                // Ekstrak nama-nama saja, hapus spasi berlebih, dan hilangkan duplikat jika ada
                allStudentsList = [...new Set(data.map(item => item.nama_lengkap.trim()))];
            } catch (err) {
                console.error("Gagal memuat daftar nama siswa:", err);
            }
        }

        function initAutoSuggest() {
            const inputElement = document.getElementById("input-nama");
            awesompleteInstance = new Awesomplete(inputElement, {
                list: allStudentsList,
                minChars: 2, // Munculkan sugesti setelah mengetik 2 huruf
                maxItems: 7, // Tampilkan maksimal 7 sugesti
                autoFirst: true // Otomatis highlight pilihan pertama
            });
        }

        function showToast(msg) {
            const toast = document.getElementById('toast-error');
            document.getElementById('toast-msg').innerText = msg;
            toast.classList.remove('toast-exit');
            toast.classList.add('toast-enter');
            
            setTimeout(() => {
                toast.classList.remove('toast-enter');
                toast.classList.add('toast-exit');
            }, 4000);
        }

        function toggleLoginLoading(isLoading) {
            const btn = document.getElementById('btn-login');
            const loader = document.getElementById('login-loading');
            
            if (isLoading) {
                btn.classList.add('hidden');
                loader.classList.remove('hidden');
            } else {
                btn.classList.remove('hidden');
                loader.classList.add('hidden');
            }
        }

        // Proses Login Kredensial Langsung Pakai Nama (Sesuai Permintaan)
        async function handleLogin(e) {
            e.preventDefault();
            // Ambil input nama dan bersihkan spasi di awal/akhir
            const nama = document.getElementById('input-nama').value.trim();
            const password = document.getElementById('input-password').value;

            if (!nama) {
                showToast("Silakan masukkan nama siswa.");
                return;
            }

            toggleLoginLoading(true);
            try {
                // Cari data siswa HANYA berdasarkan nama_lengkap
                // Menggunakan case-insensitive pencarian untuk meminimalisir salah ketik besar/kecil
                const { data, error } = await supabaseClient
                    .from('master_data_siswa')
                    .select('*')
                    .ilike('nama_lengkap', nama) 
                    .limit(1)
                    .single(); // Harapkan hanya 1 baris

                if (error || !data) {
                    toggleLoginLoading(false);
                    showToast("Nama siswa tidak ditemukan. Pastikan mengetik sesuai daftar.");
                    return;
                }

                // Cek Password
                if (data.password_awal === password) {
                    currentSession = data;
                    
                    // Terapkan Tema Warna berdasarkan Jenjang siswa yang login
                    applyThemeBranding(data.jenjang);
                    
                    // Transisi ke Dasbor
                    document.getElementById('login-view').classList.add('hidden');
                    document.getElementById('app-container').classList.remove('hidden');
                    document.getElementById('app-container').classList.add('flex');
                    
                    await loadPortalData();
                } else {
                    toggleLoginLoading(false);
                    showToast("Password salah! Silakan periksa kembali.");
                }
            } catch (err) {
                toggleLoginLoading(false);
                showToast("Koneksi ke database bermasalah. Coba lagi.");
                console.error(err);
            }
        }

        // Menerapkan warna tema HANYA DI DASBOR sesuai jenjang
        function applyThemeBranding(jenjang) {
            const sidebar = document.getElementById('sidebar');
            const logoBox = document.getElementById('sidebar-logo-box');
            const accentBar = document.getElementById('header-accent-bar');
            const avatarBox = document.getElementById('user-avatar-box');
            const badge = document.getElementById('user-jenjang-badge');
            const headTable = document.getElementById('table-jadwal-head');
            const btnSavePwd = document.getElementById('btn-save-pwd');

            // Deteksi Jenjang (Mendukung variasi penulisan)
            const jLower = jenjang ? jenjang.toLowerCase() : "";
            
            if (jLower.includes("putri")) {
                // Tema SMA Putri: Emerald Green (#00bb96)
                themeColor = "#00bb96";
                sidebar.style.backgroundColor = "#1e293b"; // Abu-abu gelap elegan
                logoBox.style.backgroundColor = "#00bb96";
                logoBox.style.color = "#ffffff";
                accentBar.style.backgroundColor = "#00bb96";
                avatarBox.style.color = "#00bb96";
                avatarBox.style.borderColor = "#ccf1e9"; // Light emerald border
                avatarBox.style.backgroundColor = "#e6f8f4"; // Very light emerald bg
                
                badge.className = "bg-[#00bb96]/10 text-[#00bb96] text-xs font-bold px-3.5 py-1.5 rounded-lg border border-[#00bb96]/20 shadow-sm transition-colors duration-500";
                headTable.className = "bg-[#00bb96] text-white transition-colors duration-500";
                
                btnSavePwd.className = "w-full bg-[#00bb96] hover:bg-[#00a382] text-white font-bold py-3.5 rounded-xl shadow-md mt-4 transition-colors duration-500 flex justify-center items-center gap-2";
                document.getElementById('spinner-loader').style.borderTopColor = "#00bb96";
                
            } else if (jLower.includes("putra")) {
                // Tema SMA Putra: Amber Gold (#ffca41 / #f59e0b)
                themeColor = "#f59e0b"; // Using slightly darker amber for better text contrast
                sidebar.style.backgroundColor = "#1e293b"; 
                logoBox.style.backgroundColor = "#f59e0b";
                logoBox.style.color = "#ffffff";
                accentBar.style.backgroundColor = "#f59e0b";
                avatarBox.style.color = "#f59e0b";
                avatarBox.style.borderColor = "#fef3c7"; 
                avatarBox.style.backgroundColor = "#fffbeb"; 
                
                badge.className = "bg-amber-100 text-amber-700 text-xs font-bold px-3.5 py-1.5 rounded-lg border border-amber-200 shadow-sm transition-colors duration-500";
                headTable.className = "bg-amber-500 text-white transition-colors duration-500";
                
                btnSavePwd.className = "w-full bg-amber-500 hover:bg-amber-600 text-white font-bold py-3.5 rounded-xl shadow-md mt-4 transition-colors duration-500 flex justify-center items-center gap-2";
                document.getElementById('spinner-loader').style.borderTopColor = "#f59e0b";
                
            } else {
                // Fallback / Netral
                themeColor = "#475569";
                sidebar.style.backgroundColor = "#1e293b";
                logoBox.style.backgroundColor = "#475569";
                accentBar.style.backgroundColor = "#475569";
                headTable.className = "bg-slate-700 text-white transition-colors duration-500";
                btnSavePwd.className = "w-full bg-slate-700 hover:bg-slate-800 text-white font-bold py-3.5 rounded-xl shadow-md mt-4 transition-colors duration-500 flex justify-center items-center gap-2";
                document.getElementById('spinner-loader').style.borderTopColor = "#475569";
            }
        }

        async function loadPortalData() {
            toggleLoadingView(true);
            try {
                renderHeaderInfo();
                await Promise.all([
                    loadJadwalData(),
                    loadPresensiData()
                ]);
                switchTab('jadwal');
            } catch (error) {
                console.error(error);
                showToast("Gagal memuat beberapa data dari server.");
            } finally {
                toggleLoadingView(false);
            }
        }

        function toggleLoadingView(show) {
            const loader = document.getElementById('loading-view');
            if (show) loader.classList.remove('hidden');
            else loader.classList.add('hidden');
        }

        function renderHeaderInfo() {
            document.getElementById('user-nama').innerText = currentSession.nama_lengkap;
            document.getElementById('user-jenjang-badge').innerText = currentSession.jenjang || "Reguler";
            document.getElementById('user-kelas').innerText = "Kelas " + (currentSession.kelas || "-");
            
            const elJurusan = document.getElementById('user-jurusan');
            if (currentSession.jurusan && currentSession.jurusan.trim() !== "") {
                elJurusan.innerText = "Jurusan " + currentSession.jurusan;
                elJurusan.classList.remove('hidden');
            } else {
                elJurusan.classList.add('hidden');
            }
            document.getElementById('sidebar-jenjang-subtitle').innerText = currentSession.jenjang || "Portal Siswa";
        }

        // Memuat Jadwal (Mencocokkan mapel siswa jika ada kolom mapel_list, atau default menampilkan jadwal_flat)
        async function loadJadwalData() {
            // Karena data kita masih 'mentah' di jadwal_flat (tidak terkait langsung per nama siswa), 
            // kita tarik semua lalu filter secara logis jika memungkinkan.
            const { data, error } = await supabaseClient
                .from('jadwal_flat')
                .select('*')
                .order('jam_mulai', { ascending: true });
                
            if (error) throw error;
            
            const tbody = document.getElementById('jadwal-body');
            tbody.innerHTML = '';
            
            if (!data || data.length === 0) {
                tbody.innerHTML = `<tr><td colspan="7" class="p-8 text-center text-slate-500">Jadwal belum tersedia di sistem.</td></tr>`;
                return;
            }

            // Gabungkan berdasarkan Jam Mulai
            const jadwalMap = new Map();
            data.forEach(row => {
                const jam = `${row.jam_mulai} - ${row.jam_selesai || '?'}`;
                if (!jadwalMap.has(jam)) {
                    jadwalMap.set(jam, { jam: jam, senin: '-', selasa: '-', rabu: '-', kamis: '-', jumat: '-', sabtu: '-' });
                }
                const entry = jadwalMap.get(jam);
                const hari = row.hari ? row.hari.toLowerCase() : '';
                if (entry.hasOwnProperty(hari)) {
                    entry[hari] = row.nama_mapel;
                }
            });

            jadwalMap.forEach(item => {
                tbody.innerHTML += `
                    <tr class="hover:bg-slate-50 transition-colors">
                        <td class="p-4 pl-6 font-bold text-slate-700 whitespace-nowrap">${item.jam}</td>
                        <td class="p-4 text-slate-600">${item.senin}</td>
                        <td class="p-4 text-slate-600">${item.selasa}</td>
                        <td class="p-4 text-slate-600">${item.rabu}</td>
                        <td class="p-4 text-slate-600">${item.kamis}</td>
                        <td class="p-4 text-slate-600">${item.jumat}</td>
                        <td class="p-4 text-slate-600">${item.sabtu}</td>
                    </tr>
                `;
            });
        }

        async function loadPresensiData() {
            const { data, error } = await supabaseClient
                .from('presensi_flat')
                .select('*')
                .eq('nama_siswa', currentSession.nama_lengkap);
                
            if (error) throw error;
            
            const container = document.getElementById('presensi-container');
            container.innerHTML = '';
            
            if (!data || data.length === 0) {
                container.innerHTML = `<div class="col-span-full p-8 text-center text-slate-500 bg-slate-50 rounded-xl border border-slate-200">Data presensi belum direkap.</div>`;
                return;
            }

            // Kelompokkan berdasarkan Mapel
            const mapelMap = {};
            data.forEach(row => {
                if (!mapelMap[row.mapel]) mapelMap[row.mapel] = [];
                mapelMap[row.mapel].push(row);
            });

            for (const [mapel, list] of Object.entries(mapelMap)) {
                // Urutkan berdasarkan Pekan
                list.sort((a, b) => {
                    const pA = parseInt(a.pekan.replace(/\D/g, '')) || 0;
                    const pB = parseInt(b.pekan.replace(/\D/g, '')) || 0;
                    return pA - pB;
                });

                let pillHTML = '';
                list.forEach(item => {
                    let st = item.status_hadir ? item.status_hadir.toLowerCase().trim() : '';
                    let bgColor = 'bg-slate-100 text-slate-500';
                    if (st === 'v' || st === '√' || st === 'hadir') bgColor = 'bg-emerald-100 text-emerald-700 border-emerald-200';
                    else if (st === 'a' || st === 'absen' || st === 'alfa') bgColor = 'bg-red-100 text-red-700 border-red-200';
                    else if (st === 's' || st === 'i' || st === 'sakit' || st === 'izin') bgColor = 'bg-blue-100 text-blue-700 border-blue-200';

                    let pLabel = item.pekan.replace('Pekan', 'P').trim();
                    pillHTML += `<div class="px-2.5 py-1 rounded border text-xs font-bold ${bgColor} shadow-sm" title="Sesi ${item.sesi}: ${item.status_hadir}">${pLabel}</div>`;
                });

                container.innerHTML += `
                    <div class="border border-slate-200 rounded-xl p-4 bg-white hover:shadow-md transition-shadow">
                        <div class="font-bold text-slate-800 mb-3 pb-2 border-b border-slate-100 flex items-center justify-between">
                            <span>${mapel}</span>
                        </div>
                        <div class="flex flex-wrap gap-2">
                            ${pillHTML}
                        </div>
                    </div>
                `;
            }
        }

        async function handleUbahPassword(e) {
            e.preventDefault();
            const pBaru = document.getElementById('pwd-baru').value;
            const pKonf = document.getElementById('pwd-konfirmasi').value;

            if (pBaru !== pKonf) {
                showToast("Password konfirmasi tidak cocok!");
                return;
            }

            const btn = document.getElementById('btn-save-pwd');
            const originalText = btn.innerHTML;
            btn.innerHTML = `<i class="fas fa-spinner fa-spin"></i> Menyimpan...`;
            btn.disabled = true;

            try {
                // Update ke Supabase
                const { error } = await supabaseClient
                    .from('master_data_siswa')
                    .update({ password_awal: pBaru })
                    .eq('id_siswa', currentSession.id_siswa);

                if (error) throw error;

                showToast("Password berhasil diperbarui!");
                document.getElementById('pwd-baru').value = '';
                document.getElementById('pwd-konfirmasi').value = '';
                currentSession.password_awal = pBaru;
                
            } catch (error) {
                console.error(error);
                showToast("Gagal mengubah password.");
            } finally {
                btn.innerHTML = originalText;
                btn.disabled = false;
            }
        }

        function switchTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
            document.getElementById('tab-' + tabId).classList.remove('hidden');
            
            document.querySelectorAll('.nav-btn').forEach(el => {
                el.classList.remove('bg-white/10', 'text-white', 'shadow-inner');
                el.classList.add('text-slate-300');
            });
            const activeBtn = document.getElementById('nav-' + tabId);
            activeBtn.classList.add('bg-white/10', 'text-white', 'shadow-inner');
            activeBtn.classList.remove('text-slate-300');
        }

        function logout() {
            currentSession = null;
            document.getElementById('app-container').classList.add('hidden');
            document.getElementById('app-container').classList.remove('flex');
            document.getElementById('login-view').classList.remove('hidden');
            
            // Kembalikan form ke state semula
            document.getElementById('form-login').reset();
            toggleLoginLoading(false);
            
            // Bersihkan input Awesomplete
            document.getElementById('input-nama').value = "";
        }
    </script>
